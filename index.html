<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HN Live AI Digest 2026</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1a1a1e;
      --accent: #ff6600;
      --text-main: #e1e1e6;
      --text-muted: #a8a8b3;
      --border: #29292e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select, button {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button:hover, select:hover {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: #fff;
      font-weight: bold;
      border: none;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .title-link {
      color: var(--text-main);
      font-weight: 600;
      text-decoration: none;
      font-size: 1.05rem;
    }

    .title-link:hover {
      color: var(--accent);
    }

    .meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
      display: flex;
      gap: 15px;
    }

    .ai-summary {
      margin-top: 12px;
      background: #202024;
      border-left: 3px solid var(--accent);
      padding: 10px 12px;
      font-size: 0.88rem;
      color: #c4c4cc;
      border-radius: 0 4px 4px 0;
    }

    .loader {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>HN AI Digest Live</h1>
    <div class="controls">
      <select id="feedType" onchange="fetchHNDigest()">
        <option value="newstories">🔥 En Yeniler (Real-time)</option>
        <option value="topstories">📈 Trendler (Top)</option>
        <option value="beststories">⭐ En İyiler (Best)</option>
        <option value="showstories">🚀 Show HN (Projeler)</option>
      </select>
      <button onclick="fetchHNDigest()">🔄 Yenile</button>
    </div>
  </header>

  <div id="feed" class="feed">
    <div class="loader">Veriler çekiliyor...</div>
  </div>
</div>

<script>
  const HN_ITEM_URL = (id) => `https://hacker-news.firebaseio.com/v0/item/${id}.json`;

  function generateAISummary(title, score, commentCount) {
    const lowerTitle = title.toLowerCase();
    if (lowerTitle.includes('ai') || lowerTitle.includes('llm') || lowerTitle.includes('gpt') || lowerTitle.includes('claude')) {
      return `🤖 **AI & Model:** Yapay zekâ teknolojileri ve büyük dil modelleri ile ilgili içerik.`;
    } else if (lowerTitle.includes('show hn')) {
      return `🚀 **Show HN:** Bir geliştiricinin toplulukla paylaştığı canlı projesi.`;
    } else if (score > 150) {
      return `🔥 **Yüksek Etkileşim:** Toplulukta popüler bir konu (${score} puan, ${commentCount} yorum).`;
    } else {
      return `⚡ **Son Dakika:** Hacker News akışına henüz düşen geliştirici içeriği.`;
    }
  }

  async function fetchHNDigest() {
    const feedElement = document.getElementById('feed');
    const feedType = document.getElementById('feedType').value;
    
    feedElement.innerHTML = '<div class="loader">Günün güncel verileri yükleniyor...</div>';

    try {
      // Seçilen akış türüne göre URL oluştur (newstories, topstories, beststories vb.)
      const response = await fetch(`https://hacker-news.firebaseio.com/v0/${feedType}.json`);
      const storyIds = await response.json();

      // En güncel ilk 8 taneyi al
      const topIds = storyIds.slice(0, 8);
      
      feedElement.innerHTML = '';

      const storyPromises = topIds.map(id => fetch(HN_ITEM_URL(id)).then(res => res.json()));
      const stories = await Promise.all(storyPromises);

      stories.forEach(story => {
        if (!story || !story.title) return;

        const card = document.createElement('div');
        card.className = 'card';
        const commentCount = story.kids ? story.kids.length : 0;
        const aiSummary = generateAISummary(story.title, story.score || 0, commentCount);

        card.innerHTML = `
          <a class="title-link" href="${story.url || `https://news.ycombinator.com/item?id=${story.id}`}" target="_blank">
            ${story.title}
          </a>
          <div class="meta">
            <span>▲ ${story.score || 0} puan</span>
            <span>💬 ${commentCount} yorum</span>
            <span>👤 ${story.by || 'anonim'}</span>
          </div>
          <div class="ai-summary">
            ${aiSummary}
          </div>
        `;

        feedElement.appendChild(card);
      });

    } catch (error) {
      feedElement.innerHTML = `<div class="loader" style="color: #ff5555;">Haberler yüklenirken bir sorun oluştu.</div>`;
      console.error(error);
    }
  }

  // İlk açılışta çalıştır
  fetchHNDigest();

  // Her 60 saniyede bir otomatik veriyi tazele
  setInterval(fetchHNDigest, 60000);
</script>
</body>
</html>
